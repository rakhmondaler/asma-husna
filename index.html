<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аль-асма аль-хусна</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05030f">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<video id="bg" src="assets/space-bg.mp4" autoplay muted loop playsinline></video>
<div id="emblem" aria-hidden="true">
  <div class="star star-veil"></div>
  <svg class="star star-line" viewBox="0 0 335.169 335.169">
    <path d="M51.584 51.584H283.584V283.584H51.584V51.584Z" stroke="white" stroke-width="4" fill="none"/>
    <path d="M167.584 3.536L331.633 167.584L167.584 331.633L3.536 167.584L167.584 3.536Z" stroke="white" stroke-width="4" fill="none"/>
  </svg>
  <div class="glow"></div>
  <div id="calligraphy" class="calligraphy"></div>
</div>
<canvas id="scene"></canvas>
<button id="menuBtn" type="button" aria-label="Поиск имени">☰</button>
<button id="randomBtn" type="button" aria-label="Случайное имя">✦</button>
<main id="card"></main>
<section id="menu" hidden></section>
<div id="hint" hidden>Листай нить свайпом или стрелками — каждая бусина открывает имя</div>
<section id="page" hidden></section>
<script type="module" src="js/app.js"></script>
</body>
</html>
